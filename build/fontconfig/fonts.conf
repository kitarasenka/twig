<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fontconfig for the Linux builds of 🌱 Twig. Copied into the packaged
  application by scripts/after-pack.mjs; the launcher points FONTCONFIG_FILE
  and FONTCONFIG_PATH at it.

  Why: Electron bundles its own fontconfig. When the host runs a newer one
  (fontconfig 2.18 writes cache format 12, Electron 41 reads 11), the bundled
  reader refuses both to read those caches and to regenerate them, reports
  every font directory as empty, and Chromium dies with
  "Could not find any font: Sans, sans" -> FATAL SkFontMgr_FontConfigInterface.
  The only thing this file changes about the host setup is the cache
  directory: a private one holds caches written by our own fontconfig, so the
  version conflict cannot happen. Font directories and the host's rendering
  preferences (conf.d) are kept as they are.
-->
<fontconfig>
  <cachedir prefix="xdg">twig/fontconfig</cachedir>

  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir>/usr/share/X11/fonts</dir>
  <dir>/run/host/fonts</dir>
  <dir>/run/host/user-fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <dir>~/.fonts</dir>

  <!-- Hinting, antialiasing and family aliases as configured on the host. -->
  <include ignore_missing="yes">/etc/fonts/conf.d</include>

  <!-- Last-resort generic families, in case the host configures none. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
      <family>Liberation Sans</family>
      <family>FreeSans</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>DejaVu Serif</family>
      <family>Liberation Serif</family>
      <family>FreeSerif</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono</family>
      <family>DejaVu Sans Mono</family>
      <family>Liberation Mono</family>
      <family>FreeMono</family>
    </prefer>
  </alias>
</fontconfig>
