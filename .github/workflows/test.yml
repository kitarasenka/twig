# Проверки на каждый push в main и на каждый pull request: ESLint и все
# Node-проверки `npm test` (они работают с настоящим Git). Смоуки Electron
# гоняются локально (`npm run test:smoke`). macOS — как у разработки: часть
# проверок зовёт hdiutil, codesign и ssh-keygen.

name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Some checks commit in throwaway repositories; a runner has no identity.
      - run: |
          git config --global user.name 'Twig CI'
          git config --global user.email 'ci@example.invalid'

      - run: npm test
