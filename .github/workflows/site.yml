# Собирает лендинг site/ и публикует его на GitHub Pages этого репозитория.
#
# Только статическая страница. Установщики Twig на Pages не помещаются (лимит
# около 1 ГБ на сайт против восьми сборок Electron), поэтому бинарники — ассеты
# GitHub Release с тегом twig-v<version>, а кнопки скачивания указывают прямо
# туда: build:site приписывает имена файлов из downloads.json к
# TWIG_SITE_DOWNLOAD_BASE (см. site/build.mjs). Пока Release с нужным тегом не
# опубликован, кнопки отдают 404 — ожидаемое состояние.
name: site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'package.json'
      - 'CHANGELOG.md'
      - 'scripts/changelog.mjs'
      - 'renderer/src/ui/tokens.css'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      # build:site нужны только @fontsource/fira-sans и tokens.css из репо —
      # ни electron, ни vite, ни playwright не требуются.
      - run: npm ci --omit=dev
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - run: npm run build:site
        env:
          TWIG_SITE_DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download/twig-v${{ steps.meta.outputs.version }}/

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
