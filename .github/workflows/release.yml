# Собирает нативные установщики Twig и публикует их как ассеты GitHub Release.
#
# Триггер — push тега вида twig-v<version> (напр. twig-v0.8.0). Тег обязан
# совпадать с "version" из package.json. Одна машина все четыре сборки не даёт
# (Windows-таргеты требуют Windows, Linux — Linux, macOS — mac), поэтому три
# раннера в матрице собирают свою часть и догружают файлы в общий релиз.
#
# Имена файлов берутся из pkg.build.* тем же electron-builder — те же, что
# ждут кнопки скачивания на сайте (site/build.mjs), поэтому после публикации
# релиза ссылки на https://kitarasenka.github.io/twig/ начинают отдавать файлы
# без пересборки сайта.

name: release

on:
  push:
    tags: ['twig-v*']

# Nothing writes by default. Only the two jobs that touch the release get
# `contents: write`; the build job runs `npm ci` (install scripts of every
# dependency) and so holds a read-only token, and hands the installers to the
# upload job as artifacts.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Verify tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "twig-v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != twig-v${version} (package.json version)"
            exit 1
          fi

      - name: Create draft release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Тело релиза — патчноуты этой версии из CHANGELOG.md, а не список
          # коммитов: релиз читает пользователь. Раздела нет — падаем здесь,
          # а не выкладываем выпуск без описания (это же проверяет npm test).
          node scripts/release-notes.mjs "${GITHUB_REF_NAME#twig-v}" > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md"
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --title "🌱 Twig ${GITHUB_REF_NAME#twig-v}" \
              --notes-file "${RUNNER_TEMP}/notes.md"
          else
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --notes-file "${RUNNER_TEMP}/notes.md"
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: 'pack:mac'
            assets: |
              release/*.dmg
          - os: windows-latest
            script: 'pack:win'
            assets: |
              release/Twig-*-windows-x64.exe
          - os: ubuntu-latest
            script: 'pack:linux'
            assets: |
              release/*.deb
              release/*.AppImage
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # The Developer ID identity goes into a keychain made here (see
      # scripts/mac-signing-keychain.sh for why not electron-builder's own
      # CSC_LINK import), and the build gets CSC_NAME + CSC_KEYCHAIN.
      # notarytool takes the App Store Connect key as a *file* (`--key <path>`),
      # so the secret (the .p8 text) is written to the runner's temp dir too.
      - name: Prepare macOS signing
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          P12_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "${MAC_CSC_LINK}" ]; then
            p12="${RUNNER_TEMP}/developer-id.p12"
            keychain="${RUNNER_TEMP}/twig-signing.keychain-db"
            (umask 077; printf '%s' "${MAC_CSC_LINK}" | base64 --decode > "${p12}")
            name=$(scripts/mac-signing-keychain.sh create "${p12}" "${keychain}")
            rm -f "${p12}"
            echo "CSC_NAME=${name}" >> "${GITHUB_ENV}"
            echo "CSC_KEYCHAIN=${keychain}" >> "${GITHUB_ENV}"
          fi
          if [ -n "${APPLE_API_KEY_P8}" ]; then
            key="${RUNNER_TEMP}/AuthKey.p8"
            (umask 077; printf '%s\n' "${APPLE_API_KEY_P8}" > "${key}")
            echo "APPLE_API_KEY_PATH=${key}" >> "${GITHUB_ENV}"
          fi
          # An unsigned release is not published: Gatekeeper would block its
          # first launch, and 🌱 Twig's updater refuses any macOS bundle not
          # signed by its developer (main/updater.js), so nobody could update to it.
          if [ -z "${MAC_CSC_LINK}" ] || [ -z "${APPLE_API_KEY_P8}" ]; then
            echo "::error::macOS signing secrets are not set — a release must be signed and notarized."
            exit 1
          fi

      - name: Package
        run: npm run ${{ matrix.script }}
        env:
          # Empty until the Developer ID identity and App Store Connect API key
          # are provisioned: the build config then keeps ad-hoc signing, and
          # fails when only some are set. CSC_NAME/CSC_KEYCHAIN come from the
          # step above.
          APPLE_API_KEY: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_ISSUER || '' }}

      # A signed build must also pass Gatekeeper exactly as a downloaded copy
      # would: Developer ID signature, notarization ticket stapled to the app.
      - name: Verify macOS signature and notarization
        if: matrix.os == 'macos-latest' && env.APPLE_API_KEY_PATH != ''
        shell: bash
        run: |
          found=0
          while IFS= read -r -d '' app; do
            found=1
            echo "== ${app}"
            codesign --verify --deep --strict --verbose=2 "${app}"
            codesign -dv --verbose=2 "${app}" 2>&1 | grep -E '^(Authority|TeamIdentifier|Runtime)'
            xcrun stapler validate "${app}"
            spctl --assess --type execute --verbose=2 "${app}"
          done < <(find release -maxdepth 2 -name '*.app' -print0)
          [ "${found}" = 1 ] || { echo "::error::no .app found under release/"; exit 1; }
          # The downloaded DMG is assessed on its own when opened.
          for dmg in release/*.dmg; do
            echo "== ${dmg}"
            codesign --verify --strict --verbose=2 "${dmg}"
            xcrun stapler validate "${dmg}"
            spctl --assess --type open --context context:primary-signature --verbose=2 "${dmg}"
          done

      - name: Remove macOS signing material
        if: always() && matrix.os == 'macos-latest'
        shell: bash
        run: |
          scripts/mac-signing-keychain.sh delete "${RUNNER_TEMP}/twig-signing.keychain-db"
          rm -f "${RUNNER_TEMP}/AuthKey.p8" "${RUNNER_TEMP}/developer-id.p12"

      - name: Hand the installers to the upload job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.assets }}
          if-no-files-found: error
          retention-days: 3

  # Runs no project code and installs nothing: the only job besides
  # create-release that can write to the repository.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers

      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber installers/*

      - name: Undraft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
