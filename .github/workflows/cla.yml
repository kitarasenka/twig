name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: cla-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cla:
    runs-on: ubuntu-latest
    # Only the signature comment and pull request events are of interest.
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')) ||
      github.event_name == 'pull_request_target'
    steps:
      - name: Check or record the CLA signature
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A classic PAT with `repo` scope on the signature repository below.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          branch: main
          path-to-document: https://github.com/kitarasenka/twig/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          # Signatures live outside this repository so a contributor never
          # needs write access here to sign.
          remote-organization-name: kitarasenka
          remote-repository-name: twig-cla-signatures
          allowlist: kitarasenka,ktarasenko,dependabot[bot]
          custom-notsigned-prcomment: >-
            Thank you for the pull request. Before it can be merged, please read
            the [CLA](https://github.com/kitarasenka/twig/blob/main/CLA.md) and
            sign it by posting the sentence below as a comment on this pull
            request.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA.'
