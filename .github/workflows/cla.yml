name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  # The signature store is a branch of this repository, written with the
  # built-in token; the action never checks out pull request code.
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: cla-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cla:
    runs-on: ubuntu-latest
    # Only the signature comment, the `recheck` comment the bot suggests and
    # pull request events are of interest.
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA') ||
        github.event.comment.body == 'recheck')) ||
      github.event_name == 'pull_request_target'
    steps:
      - name: Check or record the CLA signature
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # An orphan branch that holds only signatures/cla.json, so signing
          # never adds commits to main and needs no personal access token.
          branch: cla-signatures
          path-to-document: https://github.com/kitarasenka/twig/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          allowlist: kitarasenka,ktarasenko,dependabot[bot]
          custom-notsigned-prcomment: >-
            Thank you for the pull request. Before it can be merged, please read
            the [CLA](https://github.com/kitarasenka/twig/blob/main/CLA.md) and
            sign it by posting the sentence below as a comment on this pull
            request.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA.'
